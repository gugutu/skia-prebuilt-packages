name: Release Skia packages

on:
  workflow_dispatch:
    inputs:
      package_tag:
        description: "Immutable package tag, for example skia-chrome-m150-r0"
        required: true
        type: string
  push:
    tags:
      - "skia-chrome-m*-r*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.package_tag || github.ref_name }}
  cancel-in-progress: false

env:
  SKIA_REPO: https://skia.googlesource.com/skia.git
  SKIA_REF: refs/heads/chrome/m150
  SKIA_LABEL: chrome/m150
  SKIA_REF_SLUG: chrome-m150
  SKIA_SOURCE_CACHE_EPOCH: v1
  SKIA_OUT_CACHE_EPOCH: v1
  ANDROID_NDK_VERSION: 27.3.13750724
  ANDROID_NDK_PATH: /usr/local/lib/android/sdk/ndk/27.3.13750724

jobs:
  resolve-skia:
    name: resolve skia
    runs-on: ubuntu-24.04
    outputs:
      skia_commit: ${{ steps.resolve-skia.outputs.skia_commit }}
      package_tag: ${{ steps.resolve-skia.outputs.package_tag }}
      release_exists: ${{ steps.resolve-skia.outputs.release_exists }}
    steps:
      - name: Resolve Skia commit
        id: resolve-skia
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_exists=false
          package_tag="${{ inputs.package_tag || github.ref_name }}"
          if [[ -z "$package_tag" ]]; then
            echo "Missing package tag" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Manual releases must run from main, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          expected_pattern="^skia-${SKIA_LABEL/\//-}-r[0-9]+$"
          if [[ ! "$package_tag" =~ $expected_pattern ]]; then
            echo "Tag $package_tag does not match configured $SKIA_LABEL package pattern $expected_pattern" >&2
            exit 1
          fi
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          remote_tag="$(git ls-remote --tags --refs "$repo_url" "refs/tags/$package_tag" | awk '{print $1}')"
          if [[ -n "$remote_tag" && "$remote_tag" != "$GITHUB_SHA" ]]; then
            echo "Tag $package_tag already exists at $remote_tag, not current workflow commit $GITHUB_SHA" >&2
            exit 1
          fi
          commit="$(git ls-remote "$SKIA_REPO" "$SKIA_REF" | awk '{print $1}')"
          if [[ -z "$commit" ]]; then
            echo "Could not resolve $SKIA_REF from $SKIA_REPO" >&2
            exit 1
          fi
          if gh release view "$package_tag" >/dev/null 2>&1; then
            release_exists=true
            tmp="$(mktemp -d)"
            if ! gh release download "$package_tag" --pattern manifest.json --dir "$tmp" >/dev/null 2>&1; then
              echo "Release $package_tag exists but manifest.json is missing; refusing to mutate immutable release" >&2
              exit 1
            fi
            existing_commit="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("skia_commit", ""))' "$tmp/manifest.json")"
            if [[ "$existing_commit" != "$commit" ]]; then
              echo "Release $package_tag already records Skia $existing_commit, current $SKIA_REF resolves to $commit; refusing to mutate immutable release" >&2
              exit 1
            fi
          fi
          {
            echo "package_tag=$package_tag"
            echo "skia_commit=$commit"
            echo "release_exists=$release_exists"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: resolve-skia
    if: needs.resolve-skia.outputs.release_exists != 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runs-on: macos-26
            toolchain: macos26-default-xcode
            artifact: skia-macos-arm64
            source_cache_writer: true
          - target: macos-x64
            runs-on: macos-26
            toolchain: macos26-arm64-x64-cross-xcode
            artifact: skia-macos-x64
            source_cache_writer: false
          - target: ios-arm64
            runs-on: macos-26
            toolchain: macos26-ios-default-xcode
            artifact: skia-ios-arm64
            source_cache_writer: false
          - target: ios-simulator-arm64
            runs-on: macos-26
            toolchain: macos26-ios-simulator-default-xcode
            artifact: skia-ios-simulator-arm64
            source_cache_writer: false
          - target: android-arm64
            runs-on: ubuntu-24.04
            toolchain: android-ndk-r27d
            artifact: skia-android-arm64
            source_cache_writer: true
          - target: windows-x64
            runs-on: windows-2025-vs2026
            toolchain: windows2025-vs2026-msvc
            artifact: skia-windows-x64
            msvc_arch: x64
            source_cache_writer: true
          - target: windows-arm64
            runs-on: windows-2025-vs2026
            toolchain: windows2025-vs2026-msvc-arm64-cross
            artifact: skia-windows-arm64
            msvc_arch: x64_arm64
            source_cache_writer: false
    env:
      SKIA_COMMIT: ${{ needs.resolve-skia.outputs.skia_commit }}
      SKIA_PACKAGE_TAG: ${{ needs.resolve-skia.outputs.package_tag }}
      SKIA_PACKAGE_TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v6

      - name: Compute cache configuration hashes
        id: cache-config
        shell: bash
        run: |
          set -euo pipefail
          source_hash="$(git hash-object scripts/prepare_source.sh)"
          out_hash="$(
            git hash-object \
              scripts/build_package.sh \
              scripts/merge_static_object_closure.py \
              scripts/package_headers.py |
            git hash-object --stdin
          )"
          echo "source=$source_hash" >> "$GITHUB_OUTPUT"
          echo "out=$out_hash" >> "$GITHUB_OUTPUT"

      - name: Enable Windows long paths
        if: startsWith(matrix.target, 'windows-')
        shell: bash
        run: git config --global core.longpaths true

      - name: Restore Skia source cache
        id: restore-source-cache
        uses: actions/cache/restore@v5
        with:
          path: work/skia-source
          key: skia-source-${{ runner.os }}-${{ runner.arch }}-${{ env.SKIA_REF_SLUG }}-${{ needs.resolve-skia.outputs.skia_commit }}-${{ steps.cache-config.outputs.source }}-${{ env.SKIA_SOURCE_CACHE_EPOCH }}

      - name: Prepare Skia source
        if: steps.restore-source-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/prepare_source.sh

      - name: Save Skia source cache
        if: steps.restore-source-cache.outputs.cache-hit != 'true' && matrix.source_cache_writer
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: work/skia-source
          key: skia-source-${{ runner.os }}-${{ runner.arch }}-${{ env.SKIA_REF_SLUG }}-${{ needs.resolve-skia.outputs.skia_commit }}-${{ steps.cache-config.outputs.source }}-${{ env.SKIA_SOURCE_CACHE_EPOCH }}

      - name: Verify Skia source cache
        shell: bash
        run: test -f work/skia-source/BUILD.gn

      - name: Show Xcode toolchain
        if: startsWith(matrix.runs-on, 'macos-')
        shell: bash
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          clang++ --version

      - name: Configure Android NDK
        if: matrix.target == 'android-arm64'
        shell: bash
        run: |
          set -euo pipefail
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_home/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "sdkmanager is missing: $sdkmanager" >&2
            exit 1
          fi
          if [[ ! -d "$ANDROID_NDK_PATH" ]]; then
            (yes || true) | "$sdkmanager" --licenses >/dev/null
            (yes || true) | "$sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          fi
          test -d "$ANDROID_NDK_PATH"
          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_NDK_PATH" >> "$GITHUB_ENV"

      - name: Configure MSVC
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        env:
          MSVC_ARCH: ${{ matrix.msvc_arch }}
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw "Visual Studio with MSVC tools was not found"
          }
          $vsDevCmd = Join-Path $installPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat was not found: $vsDevCmd"
          }
          $targetArch = if ($env:MSVC_ARCH -eq "x64_arm64") { "arm64" } else { $env:MSVC_ARCH }
          $hostArch = "x64"
          $lines = cmd.exe /s /c "`"$vsDevCmd`" -no_logo -arch=$targetArch -host_arch=$hostArch && set"
          foreach ($line in $lines) {
            if ($line -notmatch "^([A-Za-z_][A-Za-z0-9_]*)=(.*)$") {
              continue
            }
            $name = $Matches[1]
            $value = $Matches[2]
            if ($name -match "^(GITHUB|RUNNER|ACTIONS)_") {
              continue
            }
            $delimiter = "MSVC_ENV_$name"
            Add-Content -Path $env:GITHUB_ENV -Value "$name<<$delimiter"
            Add-Content -Path $env:GITHUB_ENV -Value $value
            Add-Content -Path $env:GITHUB_ENV -Value $delimiter
          }

      - name: Restore Skia out cache
        id: restore-out-cache
        uses: actions/cache/restore@v5
        with:
          path: work/skia-source/out/${{ matrix.target }}
          key: skia-out-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ env.SKIA_REF_SLUG }}-${{ needs.resolve-skia.outputs.skia_commit }}-${{ steps.cache-config.outputs.out }}-${{ env.SKIA_OUT_CACHE_EPOCH }}

      - name: Build Skia
        shell: bash
        run: bash scripts/build_package.sh build

      - name: Save Skia out cache
        if: steps.restore-out-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: work/skia-source/out/${{ matrix.target }}
          key: skia-out-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ env.SKIA_REF_SLUG }}-${{ needs.resolve-skia.outputs.skia_commit }}-${{ steps.cache-config.outputs.out }}-${{ env.SKIA_OUT_CACHE_EPOCH }}

      - name: Package Skia
        shell: bash
        run: bash scripts/build_package.sh package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: work/package/${{ matrix.target }}
          compression-level: 0
          retention-days: 1

  publish:
    name: publish release
    needs:
      - resolve-skia
      - build
    if: needs.resolve-skia.outputs.release_exists != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          path: work/release-artifacts

      - name: Install release archiver
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Create release assets
        shell: bash
        env:
          SKIA_PACKAGE_TAG: ${{ needs.resolve-skia.outputs.package_tag }}
        run: bash scripts/create_release_assets.sh work/release-artifacts work/release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve-skia.outputs.package_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists and passed immutable manifest validation; leaving assets unchanged."
            exit 0
          fi
          shopt -s nullglob
          assets=(
            work/release-assets/*.tar.zst
            work/release-assets/*.tar.gz
            work/release-assets/manifest.json
            work/release-assets/checksums.txt
          )
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release create "$TAG_NAME" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "$TAG_NAME" \
            --prerelease \
            --notes-file work/release-assets/release-notes.md
