name: Build Skia macOS size compare

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  SKIA_TAG: canvaskit/0.41.0
  SKIA_TAG_SLUG: canvaskit-0.41.0
  SKIA_BUILD_CACHE_EPOCH: v1

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: macos-14
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant:
          - libgrapheme
          - icu4x

    steps:
      - uses: actions/checkout@v4

      - name: Restore Skia checkout and out cache
        id: restore-skia-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work-${{ matrix.variant }}/skia/.git
            work-${{ matrix.variant }}/skia/buildtools
            work-${{ matrix.variant }}/skia/third_party/externals
            work-${{ matrix.variant }}/skia/third_party/ninja
            work-${{ matrix.variant }}/skia/third_party/gn
            work-${{ matrix.variant }}/skia/bin/gn
            work-${{ matrix.variant }}/skia/bin/ninja.version
            work-${{ matrix.variant }}/skia/out/${{ matrix.variant }}
          key: skia-${{ runner.os }}-${{ runner.arch }}-${{ env.SKIA_TAG_SLUG }}-${{ matrix.variant }}-${{ env.SKIA_BUILD_CACHE_EPOCH }}
          restore-keys: |
            skia-${{ runner.os }}-${{ runner.arch }}-${{ env.SKIA_TAG_SLUG }}-${{ matrix.variant }}-
            skia-${{ runner.os }}-${{ runner.arch }}-${{ env.SKIA_TAG_SLUG }}-

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          clang++ --version

      - name: Build ${{ matrix.variant }}
        run: bash scripts/build_variant.sh "${{ matrix.variant }}" build

      - name: Save Skia checkout and out cache
        if: steps.restore-skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            work-${{ matrix.variant }}/skia/.git
            work-${{ matrix.variant }}/skia/buildtools
            work-${{ matrix.variant }}/skia/third_party/externals
            work-${{ matrix.variant }}/skia/third_party/ninja
            work-${{ matrix.variant }}/skia/third_party/gn
            work-${{ matrix.variant }}/skia/bin/gn
            work-${{ matrix.variant }}/skia/bin/ninja.version
            work-${{ matrix.variant }}/skia/out/${{ matrix.variant }}
          key: skia-${{ runner.os }}-${{ runner.arch }}-${{ env.SKIA_TAG_SLUG }}-${{ matrix.variant }}-${{ env.SKIA_BUILD_CACHE_EPOCH }}

      - name: Build size report
        run: bash scripts/build_variant.sh "${{ matrix.variant }}" report

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.variant }}
          path: reports/${{ matrix.variant }}

      - name: Upload stripped static archives
        uses: actions/upload-artifact@v4
        with:
          name: stripped-${{ matrix.variant }}
          path: work-${{ matrix.variant }}/stripped-libs
          compression-level: 0
          retention-days: 7

  summarize:
    name: summarize
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports

      - name: Summarize sizes
        run: |
          python3 scripts/summarize.py
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: reports/summary.md
