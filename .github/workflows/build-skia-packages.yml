name: Build Skia packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  SKIA_REPO: https://skia.googlesource.com/skia.git
  SKIA_REF: refs/heads/chrome/m150
  SKIA_LABEL: chrome/m150
  SKIA_REF_SLUG: chrome-m150
  SKIA_SOURCE_CACHE_EPOCH: v1
  SKIA_OUT_CACHE_EPOCH: v1
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_NDK_CACHE_EPOCH: v1
  ANDROID_NDK_PATH: /usr/local/lib/android/sdk/ndk/27.2.12479018

jobs:
  resolve-skia:
    name: resolve skia
    runs-on: ubuntu-24.04
    outputs:
      skia_commit: ${{ steps.resolve-skia.outputs.skia_commit }}
    steps:
      - name: Resolve Skia commit
        id: resolve-skia
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git ls-remote "$SKIA_REPO" "$SKIA_REF" | awk '{print $1}')"
          if [[ -z "$commit" ]]; then
            echo "Could not resolve $SKIA_REF from $SKIA_REPO" >&2
            exit 1
          fi
          echo "skia_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "SKIA_COMMIT=$commit" >> "$GITHUB_ENV"

  build:
    name: build ${{ matrix.target }}
    needs: resolve-skia
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runs-on: macos-26
            toolchain: macos26-default-xcode
            artifact: skia-macos-arm64
          - target: macos-x64
            runs-on: macos-26
            toolchain: macos26-arm64-x64-cross-xcode
            artifact: skia-macos-x64
          - target: ios-arm64
            runs-on: macos-26
            toolchain: macos26-ios-default-xcode
            artifact: skia-ios-arm64
          - target: ios-simulator-arm64
            runs-on: macos-26
            toolchain: macos26-ios-simulator-default-xcode
            artifact: skia-ios-simulator-arm64
          - target: android-arm64
            runs-on: ubuntu-24.04
            toolchain: android-ndk-r27c
            artifact: skia-android-arm64
          - target: windows-x64
            runs-on: windows-2025
            toolchain: windows2025-msvc
            artifact: skia-windows-x64
            msvc_arch: x64
          - target: windows-arm64
            runs-on: windows-2025
            toolchain: windows2025-msvc-arm64-cross
            artifact: skia-windows-arm64
            msvc_arch: x64_arm64
    env:
      SKIA_COMMIT: ${{ needs.resolve-skia.outputs.skia_commit }}
      SKIA_PACKAGE_TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Enable Windows long paths
        if: startsWith(matrix.target, 'windows-')
        shell: bash
        run: git config --global core.longpaths true

      - name: Restore Skia source cache
        id: restore-source-cache
        uses: actions/cache/restore@v4
        with:
          path: work/skia-source
          key: skia-source-${{ runner.os }}-${{ runner.arch }}-${{ env.SKIA_REF_SLUG }}-${{ needs.resolve-skia.outputs.skia_commit }}-${{ env.SKIA_SOURCE_CACHE_EPOCH }}

      - name: Prepare Skia source
        if: steps.restore-source-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/prepare_source.sh

      - name: Save Skia source cache
        if: steps.restore-source-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: work/skia-source
          key: skia-source-${{ runner.os }}-${{ runner.arch }}-${{ env.SKIA_REF_SLUG }}-${{ needs.resolve-skia.outputs.skia_commit }}-${{ env.SKIA_SOURCE_CACHE_EPOCH }}

      - name: Verify Skia source cache
        shell: bash
        run: |
          test -f work/skia-source/BUILD.gn

      - name: Show Xcode toolchain
        if: startsWith(matrix.runs-on, 'macos-')
        shell: bash
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          clang++ --version

      - name: Setup Android SDK
        if: matrix.target == 'android-arm64'
        uses: android-actions/setup-android@v3

      - name: Restore Android NDK cache
        id: restore-android-ndk
        if: matrix.target == 'android-arm64'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ANDROID_NDK_PATH }}
          key: android-ndk-${{ runner.os }}-${{ runner.arch }}-${{ env.ANDROID_NDK_VERSION }}-${{ env.ANDROID_NDK_CACHE_EPOCH }}

      - name: Install Android NDK
        if: matrix.target == 'android-arm64' && steps.restore-android-ndk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          (yes || true) | sdkmanager --licenses >/dev/null
          (yes || true) | sdkmanager --install "ndk;$ANDROID_NDK_VERSION"

      - name: Save Android NDK cache
        if: matrix.target == 'android-arm64' && steps.restore-android-ndk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ANDROID_NDK_PATH }}
          key: android-ndk-${{ runner.os }}-${{ runner.arch }}-${{ env.ANDROID_NDK_VERSION }}-${{ env.ANDROID_NDK_CACHE_EPOCH }}

      - name: Configure Android NDK
        if: matrix.target == 'android-arm64'
        shell: bash
        run: |
          test -d "$ANDROID_NDK_PATH"
          echo "ANDROID_NDK=$ANDROID_NDK_PATH" >> "$GITHUB_ENV"

      - name: Setup MSVC
        if: startsWith(matrix.target, 'windows-')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Restore Skia out cache
        id: restore-out-cache
        uses: actions/cache/restore@v4
        with:
          path: work/skia-source/out/${{ matrix.target }}
          key: skia-out-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ env.SKIA_REF_SLUG }}-${{ needs.resolve-skia.outputs.skia_commit }}-${{ env.SKIA_OUT_CACHE_EPOCH }}

      - name: Build Skia
        shell: bash
        run: bash scripts/build_package.sh build

      - name: Save Skia out cache
        if: steps.restore-out-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/skia-source/out/${{ matrix.target }}
          key: skia-out-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ env.SKIA_REF_SLUG }}-${{ needs.resolve-skia.outputs.skia_commit }}-${{ env.SKIA_OUT_CACHE_EPOCH }}

      - name: Package Skia
        shell: bash
        run: bash scripts/build_package.sh package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: work/package/${{ matrix.target }}
          compression-level: 0
          retention-days: 7
